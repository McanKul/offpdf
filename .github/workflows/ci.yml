name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - development

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check release version metadata
        run: npm run check:versions

      - name: Build frontend
        run: npm run build

      - name: Run tests
        run: npm test

  rust:
    name: Rust tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            poppler-utils \
            qpdf \
            wget

      - name: Show PDF engine versions
        run: |
          qpdf --version | head -n 1
          pdftotext -v 2>&1 | head -n 1
          pdftoppm -v 2>&1 | head -n 1

      - name: Use stable Rust
        run: rustup default stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Check Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Test Rust backend
        shell: bash
        env:
          # Edit text tests fail instead of skipping when qpdf or Poppler is missing;
          # the grep below also catches the older tests' `skip:` lines.
          OFFPDF_REQUIRE_ENGINES: "1"
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib -- --nocapture 2>&1 | tee rust-test.log
          skips=$(grep -c 'skip:' rust-test.log || true)
          echo "skip lines: $skips"
          if [ "$skips" -ne 0 ]; then
            grep 'skip:' rust-test.log
            echo "::error::Rust tests skipped because a PDF engine was missing"
            exit 1
          fi
