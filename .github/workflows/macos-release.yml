name: macOS Apple Silicon Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    name: Build, sign, and notarize macOS arm64
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 120
    env:
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Use stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Install macOS PDF engines
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install qpdf poppler tesseract dylibbundler

      - name: Prepare portable Apple Silicon engines
        run: ./scripts/prepare-macos-arm64.sh

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/offpdf-signing.keychain-db"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"
          rm -f "$certificate_path"

      - name: Prepare App Store Connect notarization key
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$api_key_path"
          chmod 600 "$api_key_path"
          echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"

      - name: Sign bundled PDF engines
        run: ./scripts/sign-macos-bundled-tools.sh

      - name: Build signed and notarized DMG
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: OffPDF v__VERSION__
          releaseBody: |
            OffPDF now includes 23 private PDF tools that run locally without
            uploads, accounts, or telemetry.

            Highlights:
            - Edit PDF adds text, images, shapes, lines, and freehand drawings
              without rasterizing the original document.
            - Cropped, rotated, and scaled pages preserve source content and
              overlay placement.
            - Reader accessibility, output-name validation, and metadata text
              decoding are improved.

            Thanks to @nonamexishere, @YuukiRitoTeng, @strongdan, and @joyheroes
            for contributing to this release.

            Packages:
            - Windows x64 installer (currently unsigned; SmartScreen may warn)
            - Signed and notarized DMG for Apple Silicon Macs

            See CHANGELOG.md for full details.
          releaseDraft: true
          prerelease: false
          args: --target aarch64-apple-darwin --bundles dmg

      - name: Verify application signature and notarization ticket
        run: |
          dmg_path="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg_path"

          mount_path="$RUNNER_TEMP/offpdf-dmg"
          mkdir -p "$mount_path"
          hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mount_path"
          trap 'hdiutil detach "$mount_path"' EXIT

          app_path="$(find "$mount_path" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"

          codesign --verify --strict --verbose=2 "$dmg_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
