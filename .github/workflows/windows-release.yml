name: Windows Release

on:
  workflow_dispatch:
    inputs:
      qpdf_version:
        description: Optional qpdf version, for example 12.3.2. Empty uses latest.
        required: false
        type: string
      poppler_version:
        description: Optional poppler-windows tag, for example 26.02.0-0. Empty uses latest.
        required: false
        type: string
      tesseract_version:
        description: Optional Chocolatey tesseract package version. Empty uses latest.
        required: false
        type: string
      libreoffice_version:
        description: Optional Chocolatey libreoffice-fresh package version. Empty uses latest.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-x64:
    name: Build and release Windows installer
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Use stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Bundle qpdf for Windows
        shell: pwsh
        run: ./scripts/prepare-qpdf-windows.ps1 -Version "${{ github.event.inputs.qpdf_version }}"

      - name: Bundle poppler for Windows
        shell: pwsh
        run: ./scripts/prepare-poppler-windows.ps1 -Version "${{ github.event.inputs.poppler_version }}"

      - name: Bundle Tesseract OCR for Windows
        shell: pwsh
        run: ./scripts/prepare-tesseract-windows.ps1 -Version "${{ github.event.inputs.tesseract_version }}"

      - name: Bundle LibreOffice for Windows
        shell: pwsh
        run: ./scripts/prepare-libreoffice-windows.ps1 -Version "${{ github.event.inputs.libreoffice_version }}"

      - name: Build and release Windows installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: OffPDF v__VERSION__
          releaseBody: |
            OffPDF now includes 23 private PDF tools that run locally without
            uploads, accounts, or telemetry.

            Highlights:
            - Edit PDF adds text, images, shapes, lines, and freehand drawings
              without rasterizing the original document.
            - Cropped, rotated, and scaled pages preserve source content and
              overlay placement.
            - Reader accessibility, output-name validation, and metadata text
              decoding are improved.

            Thanks to @nonamexishere, @YuukiRitoTeng, @strongdan, and @joyheroes
            for contributing to this release.

            Packages:
            - Windows x64 installer (currently unsigned; SmartScreen may warn)
            - Signed and notarized DMG for Apple Silicon Macs

            See CHANGELOG.md for full details.
          releaseDraft: true
          prerelease: false
          args: --bundles nsis

      - name: Smoke test installed application
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced.' }

          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Silent install failed with exit code $($process.ExitCode)." }

          $appPath = Join-Path $env:LOCALAPPDATA 'OffPDF\offpdf.exe'
          if (-not (Test-Path $appPath)) { throw "Installed application not found at $appPath" }

          foreach ($runtime in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            $runtimePath = Join-Path (Split-Path $appPath) $runtime
            if (-not (Test-Path $runtimePath)) { throw "Required runtime is missing: $runtimePath" }
          }

          $app = Start-Process -FilePath $appPath -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw "OffPDF exited during startup with code $($app.ExitCode)." }
          Stop-Process -Id $app.Id -Force

      - name: List bundle outputs
        shell: pwsh
        run: Get-ChildItem -Path src-tauri/target/release/bundle -Recurse | Select-Object FullName, Length
